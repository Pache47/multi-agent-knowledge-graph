[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-assistant"
version = "0.1.0"
description = "Multi-agent knowledge graph construction and evidence-grounded retrieval for factory maintenance"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.40,<2",
  "neo4j>=5.0,<7",
  "filelock>=3.16,<4",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
manuals = ["reportlab>=4,<5"]
notebooks = ["jupyterlab>=4,<5", "matplotlib>=3.9,<4", "networkx>=3.3,<4", "scipy>=1.13,<2"]

[project.scripts]
factory-demo = "factory_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
